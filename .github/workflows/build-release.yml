name: Build & draft release

# - every pull request to main: build the Windows zip, portable exe and installer and attach them to the run
# - pushing a tag like v2.1.0: build, then create a DRAFT release with all three attached.
#   Publishing the draft by hand is what fires the Discord notification (a release published
#   by a workflow's own token does not trigger other workflows).
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tracker (Muffins Tracker 2.0) is built from the fork commit pinned in tracker-source.json;
      # its lockfile is bun.lock, so bun builds it (see scripts/build-tracker.js).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # The layout-restore helper's matching and placement rules, run against fake windows
      # (scripts/test-helper.js compiles the production C# methods with the runner's csc).
      - name: Window helper tests
        run: npm run test:helper

      # builds the tracker into tracker/, compiles native/WinHelper.cs with the runner's .NET
      # Framework csc, then packages
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Packaged app must contain the prebuilt helper and the launcher preload
        shell: bash
        run: |
          test -f "dist/win-unpacked/resources/WinHelper.exe" || { echo "::error::WinHelper.exe missing from resources"; exit 1; }
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar > asar.txt
          for f in /main.js /preload.js /launcher-preload.js /renderer.html /renderer.js /styles.css /native/WinHelper.cs /tracker/index.html /tracker/build-source.txt /racetimer/racetimer.html; do
            grep -qxF "$f" asar.txt || grep -qxF "${f//\//\\}" asar.txt || { echo "::error::$f missing from app.asar"; exit 1; }
          done
          test -f "dist/ALTTPR-PO-Launcher.exe" || { echo "::error::portable exe missing"; exit 1; }
          test -f "dist/ALTTPR-PO-Launcher-Setup.exe" || { echo "::error::installer missing"; exit 1; }
          n=$(grep -c -E '^[/\\]tracker[/\\]assets[/\\]' asar.txt || true)
          test "$n" -gt 5 || { echo "::error::tracker assets missing from app.asar ($n entries)"; exit 1; }
          echo "tracker built from $(cat tracker/build-source.txt)"
          ls -l dist/*.exe

      - name: Self-test the packaged app (boots it for real; see runSelfTest in main.js)
        shell: pwsh
        run: |
          $env:PO_LAUNCHER_SELFTEST = "$PWD\selftest.json"
          $env:PO_LAUNCHER_SELFTEST_SHOTS = "$PWD\selftest-shots"
          $p = Start-Process -FilePath "dist\win-unpacked\ALTTPR PO Launcher.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test timed out" }
          if (Test-Path selftest.json) { Get-Content selftest.json } else { throw "self-test wrote no report" }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      # The portable exe unpacks ~400 MB to TEMP on every launch (about 7 s with Defender scanning it).
      # The zip is the same app as a folder: extract once, launch in about a second.
      - name: Zip the unpacked app (fast-launch alternative to the portable exe)
        shell: pwsh
        run: |
          $stage = "dist\zip-stage\ALTTPR PO Launcher"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist\win-unpacked\*" $stage -Recurse -Force
          Compress-Archive -Path "dist\zip-stage\ALTTPR PO Launcher" -DestinationPath "dist\ALTTPR-PO-Launcher-win64.zip" -CompressionLevel Optimal -Force
          $exeInZip = [IO.Compression.ZipFile]::OpenRead("$PWD\dist\ALTTPR-PO-Launcher-win64.zip").Entries | Where-Object { $_.FullName -eq 'ALTTPR PO Launcher/ALTTPR PO Launcher.exe' }
          if (-not $exeInZip) { throw "zip does not contain 'ALTTPR PO Launcher/ALTTPR PO Launcher.exe'" }
          Get-Item dist\*.zip, dist\*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB)}}

      # What the self-test saw: the launcher, the tracker's Launch page and a fresh tracker session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-screenshots
          path: selftest-shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ALTTPR-PO-Launcher
          path: |
            dist/ALTTPR-PO-Launcher-win64.zip
            dist/ALTTPR-PO-Launcher.exe
            dist/ALTTPR-PO-Launcher-Setup.exe
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ALTTPR-PO-Launcher-win64.zip dist/ALTTPR-PO-Launcher.exe dist/ALTTPR-PO-Launcher-Setup.exe --draft --generate-notes --title "ALTTPR PO Launcher $GITHUB_REF_NAME"
